
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Crypto Live Studio</title>
    <link href="/public/crypto-heist-unified.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        body { 
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .hud-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .logo { 
            font-size: 1.2rem;
        }
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }
        .sidebar {
            width: 300px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        .sidebar.collapsed {
            transform: translateX(-300px);
        }
        .sidebar-header {
            padding: 16px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .file-item {
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 6px;
            margin: 4px 0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            transition: all 0.3s ease;
        }
        .file-item:hover {
            background: rgba(0, 255, 136, 0.1);
            color: var(--color-primary);
            transform: translateX(4px);
        }
        .file-item.active {
            background: rgba(0, 255, 136, 0.2);
            color: var(--color-primary);
            border-left: 3px solid var(--color-primary);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .tabs {
            display: flex;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }
        .tab {
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.5);
            border-right: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 140px;
            color: #fff;
            transition: all 0.3s ease;
        }
        .tab.active {
            background: rgba(0, 255, 136, 0.1);
            color: var(--color-primary);
            border-bottom: 2px solid var(--color-primary);
        }
        .tab:hover {
            background: rgba(0, 255, 136, 0.05);
        }
        .tab-close {
            margin-left: auto;
            color: #888;
        }
        .tab-close:hover {
            color: var(--color-primary);
        }
        .editor-wrapper {
            flex: 1;
            position: relative;
            border: 1px solid var(--border-color);
        }
        #editor {
            width: 100%;
            height: 100%;
        }
        .output-panel {
            width: 400px;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        .output-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid var(--border-color);
        }
        .output-tab {
            padding: 10px 18px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #fff;
            transition: all 0.3s ease;
        }
        .output-tab.active {
            background: rgba(0, 255, 136, 0.1);
            color: var(--color-primary);
            border-bottom: 2px solid var(--color-primary);
        }
        .output-tab:hover {
            background: rgba(0, 255, 136, 0.05);
        }
        .output-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .ai-chat {
            display: none;
        }
        .ai-chat.active {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        .ai-message {
            margin: 12px 0;
            padding: 14px;
            border-radius: 8px;
            max-width: 90%;
        }
        .ai-message.user {
            background: var(--bg-panel);
            margin-left: auto;
            border-left: 3px solid var(--color-primary);
        }
        .ai-message.ai {
            background: var(--bg-card);
            border-left: 3px solid var(--color-secondary);
        }
        .ai-input-container {
            padding: 16px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
        }
        .toolbar {
            padding: 10px 16px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .toggle-sidebar {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
            font-size: 18px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .toggle-sidebar:hover {
            background: rgba(0, 255, 136, 0.2);
        }
        .console-output {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: var(--color-primary);
        }
        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
    </style>
</head>
<body>
    <div class="cyber-bg"></div>
    <div class="grid-overlay"></div>

    <!-- Header -->
    <div class="hud-header">
        <a href="/" class="logo" style="text-decoration: none;">
            <span>₿</span>
            <span>CRYPTO HEIST - Live Studio</span>
        </a>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button class="cyber-btn" onclick="saveFile()">💾 Save</button>
            <button class="cyber-btn" onclick="runCode()">▶️ Run</button>
            <button class="cyber-btn-outline" onclick="formatCode()">✨ Format</button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>📁 Files</span>
                <button class="toggle-sidebar" onclick="toggleSidebar()">×</button>
            </div>
            <div class="file-tree" id="fileTree"></div>
        </div>

        <!-- Editor Container -->
        <div class="editor-container">
            <div class="toolbar">
                <button class="toggle-sidebar btn-secondary" onclick="toggleSidebar()">☰</button>
                <span id="currentFile" style="flex: 1; font-size: 13px;">No file selected</span>
            </div>
            <div class="tabs" id="tabs"></div>
            <div class="editor-wrapper">
                <div id="editor"></div>
            </div>
        </div>

        <!-- Output Panel -->
        <div class="output-panel">
            <div class="output-tabs">
                <div class="output-tab active" onclick="switchOutputTab('console')">Console</div>
                <div class="output-tab" onclick="switchOutputTab('preview')">Preview</div>
                <div class="output-tab" onclick="switchOutputTab('ai')">AI Chat</div>
            </div>
            <div class="output-content">
                <div id="console-output" class="console-output active"></div>
                <iframe id="preview-output" class="preview-frame" style="display: none;"></iframe>
                <div id="ai-chat" class="ai-chat">
                    <div class="ai-messages" id="aiMessages"></div>
                    <div class="ai-input-container">
                        <textarea class="cyber-input" id="aiInput" placeholder="Ask AI anything about your code..." rows="2"></textarea>
                        <button class="cyber-btn" onclick="sendAIMessage()" style="margin-top: 8px; width: 100%;">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = 'AIzaSyBx_KDiJt6z-7kPf1fwpG-jLBfL4NKaOYA';
        const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent';

        let editor;
        let openTabs = {};
        let activeFile = null;
        let files = {};

        // Initialize Monaco Editor
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '// Select a file from the sidebar to start editing',
                language: 'javascript',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: true }
            });
        });

        // File system structure
        const fileStructure = {
            'src': {
                'bitcoin_puzzle_toolkit.py': 'python',
                'web_interface.py': 'python',
                'crypto_environment_manager.py': 'python',
                'integration_hub.py': 'python',
                'master_controller.py': 'python'
            },
            'public': {
                'ai-suite.html': 'html',
                'character-set-workbench.html': 'html'
            },
            'server': {
                'bitcoin-toolkit-server.js': 'javascript',
                'charset-dsl.js': 'javascript',
                'common.js': 'javascript',
                'hd-wallet-core.js': 'javascript'
            },
            'docs': {
                'unified_api.json': 'json'
            }
        };

        // Load file tree
        function loadFileTree() {
            const fileTree = document.getElementById('fileTree');
            fileTree.innerHTML = '';

            for (const [folder, files] of Object.entries(fileStructure)) {
                const folderDiv = document.createElement('div');
                folderDiv.innerHTML = `<div style="font-weight: 600; margin: 8px 0; color: #F7931A;">📂 ${folder}</div>`;
                fileTree.appendChild(folderDiv);

                for (const [file, type] of Object.entries(files)) {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-item';
                    fileDiv.innerHTML = `<span>${getFileIcon(type)}</span> ${file}`;
                    fileDiv.onclick = () => openFile(`${folder}/${file}`, type);
                    fileTree.appendChild(fileDiv);
                }
            }
        }

        function getFileIcon(type) {
            const icons = {
                'python': '🐍',
                'javascript': '⚡',
                'html': '📄',
                'json': '📋'
            };
            return icons[type] || '📄';
        }

        function openFile(path, language) {
            activeFile = path;
            document.getElementById('currentFile').textContent = path;

            // Add tab if not already open
            if (!openTabs[path]) {
                openTabs[path] = { path, language, content: '' };
                updateTabs();
            }

            // Load file content
            fetch(`/api/file/${path}`)
                .then(res => res.json())
                .then(data => {
                    const content = data.success ? data.content : `// File: ${path}\n// Click "Run" to execute or edit this file`;
                    openTabs[path].content = content;
                    editor.setValue(content);
                    monaco.editor.setModelLanguage(editor.getModel(), language);
                    logConsole(`Loaded: ${path}`);
                })
                .catch(err => {
                    const content = `// File: ${path}\n// Sample content - edit and save`;
                    openTabs[path].content = content;
                    editor.setValue(content);
                    monaco.editor.setModelLanguage(editor.getModel(), language);
                });

            // Update active tab
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.path === path);
            });

            // Update active file in tree
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.toggle('active', item.textContent.includes(path.split('/')[1]));
            });
        }

        function updateTabs() {
            const tabsContainer = document.getElementById('tabs');
            tabsContainer.innerHTML = '';

            for (const [path, tab] of Object.entries(openTabs)) {
                const tabDiv = document.createElement('div');
                tabDiv.className = 'tab' + (path === activeFile ? ' active' : '');
                tabDiv.dataset.path = path;
                tabDiv.innerHTML = `
                    <span>${path.split('/')[1]}</span>
                    <span class="tab-close" onclick="closeTab('${path}', event)">×</span>
                `;
                tabDiv.onclick = (e) => {
                    if (!e.target.classList.contains('tab-close')) {
                        openFile(path, tab.language);
                    }
                };
                tabsContainer.appendChild(tabDiv);
            }
        }

        function closeTab(path, event) {
            event.stopPropagation();
            delete openTabs[path];
            updateTabs();

            if (path === activeFile) {
                const remaining = Object.keys(openTabs);
                if (remaining.length > 0) {
                    openFile(remaining[0], openTabs[remaining[0]].language);
                } else {
                    activeFile = null;
                    editor.setValue('// Select a file to start editing');
                    document.getElementById('currentFile').textContent = 'No file selected';
                }
            }
        }

        function saveFile() {
            if (!activeFile) {
                logConsole('No file selected');
                return;
            }

            const content = editor.getValue();
            openTabs[activeFile].content = content;

            // Save to server
            fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: activeFile, content })
            })
            .then(res => res.json())
            .then(data => {
                logConsole(`✅ Saved: ${activeFile}`);
            })
            .catch(err => {
                logConsole(`⚠️  Saved locally: ${activeFile} (server save pending)`);
            });
        }

        function runCode() {
            if (!activeFile) {
                logConsole('No file selected');
                return;
            }

            const content = editor.getValue();
            logConsole(`▶️  Running: ${activeFile}\n`);

            // Execute based on file type
            const language = openTabs[activeFile].language;
            
            if (language === 'html') {
                // Show in preview
                switchOutputTab('preview');
                const preview = document.getElementById('preview-output');
                preview.srcdoc = content;
                logConsole('✅ Preview updated');
            } else if (language === 'javascript') {
                try {
                    const result = eval(content);
                    logConsole(`Result: ${result}`);
                } catch (err) {
                    logConsole(`❌ Error: ${err.message}`);
                }
            } else {
                logConsole('Execute via server for Python files');
            }
        }

        function formatCode() {
            if (editor) {
                editor.getAction('editor.action.formatDocument').run();
                logConsole('✨ Code formatted');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function switchOutputTab(tab) {
            document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('console-output').style.display = tab === 'console' ? 'block' : 'none';
            document.getElementById('preview-output').style.display = tab === 'preview' ? 'block' : 'none';
            document.getElementById('ai-chat').classList.toggle('active', tab === 'ai');
        }

        function logConsole(message) {
            const output = document.getElementById('console-output');
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `[${timestamp}] ${message}\n`;
            output.scrollTop = output.scrollHeight;
        }

        async function sendAIMessage() {
            const input = document.getElementById('aiInput');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            addAIMessage('user', message);

            const context = activeFile ? `Current file: ${activeFile}\n\n${editor.getValue()}` : 'No file selected';

            try {
                const response = await fetch(`${GEMINI_API_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are a coding assistant. Context:\n${context}\n\nUser question: ${message}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Error getting response';
                addAIMessage('ai', aiResponse);
            } catch (error) {
                addAIMessage('ai', `Error: ${error.message}`);
            }
        }

        function addAIMessage(type, content) {
            const messagesDiv = document.getElementById('aiMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `ai-message ${type}`;
            messageDiv.innerHTML = `<strong>${type === 'user' ? '👤 You:' : '🤖 AI:'}</strong><br>${content.replace(/\n/g, '<br>')}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                runCode();
            }
        });

        // Enter key in AI chat
        document.getElementById('aiInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendAIMessage();
            }
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            loadFileTree();
            logConsole('🚀 Live Code Studio Ready');
            logConsole('💡 Tip: Ctrl/Cmd+S to save, Ctrl/Cmd+Enter to run');
        });
    </script>
</body>
</html>
